name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build StreamPulse Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Assets to Android
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: cp android/app/build/outputs/apk/debug/app-debug.apk StreamPulse_TV.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamPulse-TV-APK
          path: StreamPulse_TV.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: latest
          name: "StreamPulse TV APK (Latest)"
          body: |
            ### StreamPulse TV Android APK (Mobile & Smart TV)
            Updated with:
            - Full mobile responsiveness with collapsible sidebar drawer
            - Single clean hamburger menu and mobile bottom navigation
            - 2-column mobile channel grid layout
            - Touch-optimized OSD controls and mobile software keyboard support
          files: StreamPulse_TV.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
