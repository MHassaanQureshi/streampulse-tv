<!doctype html>
<html lang="en" style="background-color: #06080f;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#06080f" />
    <title>StreamPulse TV - Smart IPTV Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      // Smart TV Error Trapper
      window.onerror = function(msg, url, line) {
        if (!msg) return;
        var str = String(msg);
        if (str.indexOf('import.meta') !== -1 || str.indexOf('ResizeObserver') !== -1) {
          return true; // Ignore harmless feature detection checks
        }
        var errBox = document.getElementById('tv-diag-box');
        if (!errBox) {
          errBox = document.createElement('div');
          errBox.id = 'tv-diag-box';
          errBox.style.cssText = 'position:fixed;bottom:10px;left:10px;right:10px;background:rgba(239,68,68,0.9);color:#fff;padding:12px;border-radius:8px;z-index:999999;font-size:14px;font-family:sans-serif;';
          document.body.appendChild(errBox);
        }
        errBox.innerHTML = 'TV Diagnostic: ' + str + ' (Line: ' + line + ')';
      };
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #06080f !important;
        color: #f8fafc;
        overflow: hidden;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body style="background-color: #06080f; color: #fff;">
    <div id="root">
      <div id="tv-boot-screen" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #06080f; color: #fff; font-family: sans-serif;">
        <div style="width: 44px; height: 44px; border: 4px solid rgba(99,102,241,0.2); border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <h2 style="font-size: 20px; margin: 0 0 6px 0; font-weight: 700; letter-spacing: -0.5px;">StreamPulse TV</h2>
        <p style="color: #94a3b8; font-size: 13px; margin: 0;">Starting TV Engine...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
